# Fast feedback before the push, after `pre-commit install`. These gate nothing;
# the binding ones run in CI. Stages and the clang-tidy gate: operations.md.
exclude: '^(external/|build/)'
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        # Only real YAML files — .clang-tidy / .clang-format are YAML-ish but
        # have their own validators (clang-tidy / clang-format).
        files: '\.(yaml|yml)$'
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-added-large-files
        args: ['--maxkb=2048']

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: '\.(cpp|hpp|h)$'

      - id: build
        name: ninja build
        entry: ninja -C build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: tests
        name: ctest
        entry: ctest --test-dir build --output-on-failure
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
