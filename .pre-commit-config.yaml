# Local quality gates: fast feedback before the push. They gate nothing — they
# live in the clone and run only after `pre-commit install`. The binding gates
# are in CI (.forgejo/workflows/build.yml, see operations.md). Install once per
# clone with:
#
#     pre-commit install
#
# Hook stages:
#   commit : fast formatting/hygiene checks (auto-fix where possible)
#   push   : full build + unit tests — must be green to push
#   manual : clang-tidy, the same gate CI runs — held at zero findings, but off
#            the push path because it costs a minute. Run it on demand with:
#                pre-commit run clang-tidy --hook-stage manual
exclude: '^(external/|build/)'
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        # Only real YAML files — .clang-tidy / .clang-format are YAML-ish but
        # have their own validators (clang-tidy / clang-format).
        files: '\.(yaml|yml)$'
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-added-large-files
        args: ['--maxkb=2048']

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        files: '\.(cpp|hpp|h)$'

      - id: build
        name: ninja build
        entry: ninja -C build
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: tests
        name: ctest
        entry: ctest --test-dir build --output-on-failure
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # build-clang, not build: the target exists in a clang tree alone, and
      # through the target rather than run-clang-tidy, so hook and CI grade by
      # one definition. operations.md configures the tree.
      - id: clang-tidy
        name: clang-tidy gate
        entry: cmake --build build-clang --target clang-tidy
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
