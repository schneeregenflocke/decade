# CI on forgejo.blem.ch (the mirror github-mirror/decade). One job per compiler: GCC
# builds what ships and carries the sanitizer gate, clang carries clang-tidy —
# a tool that parses with clang's frontend and needs a clang database.
# `runner-laptop-omen` binds both jobs EXCLUSIVELY to the CI runner on
# laptop-omen — the heavy C++ build never runs on homelab, an RPi 4 with 4 GB of
# RAM whose job container is capped at 1200 MB.
# Triggered by the mirror sync, which a GitHub webhook sets off on every push.
name: build
on:
  push:
    branches: [main]

# The dependency list stands in both jobs because it gets installed BEFORE the
# checkout: actions/checkout is a JS action and needs node and git in the bare
# container, so no file from the repository can carry the list yet.
# ubuntu:26.04 ends at LLVM 22 and a GCC 16 snapshot; LLVM 23, the version the
# developer machines run, comes from apt.llvm.org, its key bound to that source.
jobs:
  gcc:
    runs-on: runner-laptop-omen
    container:
      image: ubuntu:26.04
    steps:
      - name: Toolchain and dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
          echo 'deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main' \
            > /etc/apt/sources.list.d/apt.llvm.org.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nodejs git cmake ninja-build pkg-config g++-16 clang-format-23 \
            libboost-serialization-dev libepoxy-dev qt6-base-dev \
            zlib1g-dev libpng-dev libfontconfig-dev libfreetype-dev \
            libicu-dev libglm-dev libmsgsl-dev libgtest-dev libgl1-mesa-dev
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # First, because it needs no build and the drift of #63 arose precisely
      # from a hook nobody had installed — a local gate is no gate.
      - name: clang-format gate
        run: |
          git ls-files '*.hpp' '*.cpp' | grep -v '^external/' \
            | xargs clang-format-23 --dry-run -Werror
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16
      - name: Build
        run: ninja -C build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      # Rebuilds the tree instrumented and runs the tests underneath — a run
      # finds errors, a build alone does not. Around 195 s from scratch on
      # twelve cores, so it stays on every push rather than on a schedule.
      - name: Sanitizer gate (address, leak, undefined, float checks)
        run: cmake --build build --target sanitize-address

  clang:
    runs-on: runner-laptop-omen
    container:
      image: ubuntu:26.04
    steps:
      - name: Toolchain and dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /etc/apt/keyrings/apt.llvm.org.asc
          echo 'deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main' \
            > /etc/apt/sources.list.d/apt.llvm.org.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nodejs git cmake ninja-build pkg-config clang-23 clang-tidy-23 \
            libboost-serialization-dev libepoxy-dev qt6-base-dev \
            zlib1g-dev libpng-dev libfontconfig-dev libfreetype-dev \
            libicu-dev libglm-dev libmsgsl-dev libgtest-dev libgl1-mesa-dev
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The build and the tests run here too: clang sees warnings GCC does not
      # (-Wunreachable-code, -Wextra-semi), and a gate over code that never ran
      # under this compiler would grade an artefact nobody executes.
      # Versioned, not the `clang` metapackage: that one points at 21 on
      # ubuntu:26.04, whose clang-tidy carries a false positive 22 has fixed.
      # CMakeLists picks the matching run-clang-tidy off the compiler version,
      # so this one line steers both.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
      - name: Build
        run: ninja -C build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      # sanitize-memory deliberately stays out although clang knows it:
      # MemorySanitizer demands every dependency instrumented, and the system
      # libstdc++ and gtest are not — it is a local diagnostic tool (#51).
      - name: clang-tidy gate
        run: cmake --build build --target clang-tidy
