# CI on git.blem.ch (the mirror github-mirror/decade): build plus ctest plus the
# clang-tidy and sanitizer gates.
# `runner-laptop-omen` binds the job EXCLUSIVELY to the CI runner on laptop-omen —
# the heavy C++ build (Boost, Qt, submodules) never runs on homelab (an RPi 4 on
# USB SMR), where it drives the disk into I/O saturation (the loadavg incident of
# 2026-07-11) and would fail on the 1200 MB limit. Is the laptop off, the job
# waits in the queue instead of falling back to homelab. Triggered by the mirror
# sync, which a GitHub webhook sets off at once on every push.
name: build
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: runner-laptop-omen
    container:
      image: ubuntu:26.04
    steps:
      # Before the checkout: actions/checkout is a JS action and needs node AND
      # git in the job container (the bare Ubuntu image carries neither).
      - name: Toolchain and dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nodejs git cmake ninja-build pkg-config g++ clang clang-tidy \
            clang-format \
            libboost-serialization-dev libepoxy-dev qt6-base-dev \
            zlib1g-dev libpng-dev libfontconfig-dev libfreetype-dev \
            libicu-dev libglm-dev libmsgsl-dev libgtest-dev libgl1-mesa-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # First, because it needs no build and the drift of #63 arose precisely
      # from a hook nobody had installed — a local gate is no gate.
      - name: clang-format gate
        run: |
          git ls-files '*.hpp' '*.cpp' | grep -v '^external/' \
            | xargs clang-format --dry-run -Werror
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: ninja -C build
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: clang-tidy gate
        run: cmake --build build --target clang-tidy
      # Rebuilds the tree instrumented and runs the tests underneath — a run
      # finds errors, a build alone does not. The tree gets held at zero
      # findings, and a hit breaks the job. Around 195 s from scratch on twelve
      # cores, so it stays on every push rather than on a schedule.
      # sanitize-memory deliberately does not run along: MemorySanitizer demands
      # that ALL dependencies be instrumented, and with the system libstdc++ and
      # gtest it reports false alarms out of foreign code — during gtest
      # discovery already. It stays a local diagnostic tool, see operations.md.
      - name: Sanitizer gate (address, leak, undefined, float checks)
        run: cmake --build build --target sanitize-address
